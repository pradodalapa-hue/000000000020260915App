<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DONY BURGUER'S - PAGAMENTO PIX</title>

    <!-- METATAGS PARA O WHATSAPP -->
    <meta property="og:title" content="🍔 DONY BURGUER'S - PAGUE COM PIX!">
    <meta property="og:description" content="Pague com Pix de forma instantânea e confirme seu pedido.">
    <meta property="og:image" content="https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1790472078751_1001572650.jpg">
    <meta property="og:type" content="website">

    <!-- MOTOR DE QRCODE LOCAL E ÍCONES -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- TELA DE SEGURANÇA SLIDER JDP -->
    <script>
    (function() {
        const FOTO_BLOQUEIO = "https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1790458867299_Screenshot_20260926_173717_Chrome_Beta.jpg";
        let tentativas = 0;
        const maxTentativas = 3;

        function criarTelaSeguranca() {
            if (document.getElementById('jdp-seguranca-overlay')) return;

            const overlay = document.createElement('div');
            overlay.id = 'jdp-seguranca-overlay';
            overlay.style.cssText = `
                position: fixed; inset: 0; z-index: 999999;
                background: #020617; display: flex; flex-direction: column;
                align-items: center; justify-content: center; font-family: 'Inter', sans-serif;
                color: #fff; user-select: none; padding: 20px;
            `;

            overlay.innerHTML = `
                <div style="background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 25px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.8);">
                    <h3 style="color: #fde047; font-size: 15px; font-weight: 900; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">🍔 Dony Burguer's</h3>
                    <p style="color: #94a3b8; font-size: 11px; margin-bottom: 25px;">Arraste para confirmar acesso seguro ao pagamento.</p>
                    
                    <div id="jdp-slider-track" style="position: relative; width: 100%; height: 50px; background: #020617; border-radius: 25px; border: 1px solid #1e293b; overflow: hidden; display: flex; align-items: center;">
                        <span id="jdp-slider-text" style="position: absolute; width: 100%; text-align: center; font-size: 10px; font-weight: 800; color: #64748b; letter-spacing: 1px; pointer-events: none; text-transform: uppercase;">Puxe para liberar ➔</span>
                        <div id="jdp-slider-btn" style="position: absolute; left: 0; width: 50px; height: 50px; background: #fde047; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #000; font-weight: 900; font-size: 18px; box-shadow: 0 0 10px rgba(253,224,71,0.5);">🍔</div>
                    </div>
                    <p id="jdp-tentativas-txt" style="color: #ef4444; font-size: 10px; margin-top: 15px; font-weight: bold; min-height: 14px;"></p>
                </div>
            `;

            document.documentElement.appendChild(overlay);

            const btn = document.getElementById('jdp-slider-btn');
            const track = document.getElementById('jdp-slider-track');
            const txtTentativas = document.getElementById('jdp-tentativas-txt');
            let arrastando = false;

            function iniciarArrasto() { arrastando = true; }

            function moverArrasto(e) {
                if (!arrastando) return;
                const trackRect = track.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                let deslocamento = clientX - trackRect.left - 25;

                const maxDeslocamento = track.clientWidth - 50;
                if (deslocamento < 0) deslocamento = 0;
                if (deslocamento > maxDeslocamento) deslocamento = maxDeslocamento;

                btn.style.left = deslocamento + 'px';

                if (deslocamento >= maxDeslocamento - 5) {
                    arrastando = false;
                    sucessoAcesso();
                }
            }

            function pararArrasto() {
                if (!arrastando) return;
                arrastando = false;
                
                const trackRect = track.getBoundingClientRect();
                const btnRect = btn.getBoundingClientRect();
                const maxDeslocamento = track.clientWidth - 50;

                if ((btnRect.left - trackRect.left) < (maxDeslocamento - 15)) {
                    btn.style.left = '0px';
                    tentativas++;
                    
                    if (tentativas >= maxTentativas) {
                        bloqueioTotalDefinitivo();
                    } else {
                        txtTentativas.innerText = `Tentativa incorreta (${tentativas}/${maxTentativas}). Tente novamente.`;
                    }
                }
            }

            btn.addEventListener('mousedown', iniciarArrasto);
            window.addEventListener('mousemove', moverArrasto);
            window.addEventListener('mouseup', pararArrasto);

            btn.addEventListener('touchstart', iniciarArrasto);
            window.addEventListener('touchmove', moverArrasto);
            window.addEventListener('touchend', pararArrasto);
        }

        function sucessoAcesso() {
            const overlay = document.getElementById('jdp-seguranca-overlay');
            if (overlay) overlay.remove();
        }

        function bloqueioTotalDefinitivo() {
            document.body.innerHTML = `
                <div style="width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; margin: 0; padding: 0; overflow: hidden; position: fixed; inset: 0; z-index: 9999999;">
                    <img src="${FOTO_BLOQUEIO}" style="width: 100vw; height: 100vh; object-fit: cover; margin: 0; padding: 0; display: block;" alt="Bloqueio">
                </div>
            `;
            window.stop();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', criarTelaSeguranca);
        } else {
            criarTelaSeguranca();
        }
    })();
    </script>

    <style>
        :root { 
            --bg: #020617; 
            --card: #090d16; 
            --accent: #06b6d4; 
            --text: #ffffff; 
            --gold: #fde047;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; background: var(--card); padding: 22px; border-radius: 16px; border: 1px solid #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h1 { color: var(--gold); font-size: 1.25rem; text-align: center; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; font-weight: 900; }
        .sub { color: #94a3b8; font-size: 0.8rem; text-align: center; margin-bottom: 18px; }
        
        .valor-input { width: 100%; padding: 14px; background: #020617; border: 1px solid var(--accent); color: #38bdf8; border-radius: 8px; box-sizing: border-box; font-size: 1.4rem; margin-bottom: 15px; text-align: center; font-weight: bold; }
        
        .btn-principal { width: 100%; padding: 15px; background: var(--accent); color: #020617; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 0.95rem; box-shadow: 0 0 15px rgba(6,182,212,0.3); text-transform: uppercase; }
        .btn-principal:active { transform: scale(0.98); }
        
        #pagamento-area { display: none; margin-top: 20px; border-top: 1px solid #1e293b; padding-top: 18px; }
        .pix-flex { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 15px; }
        
        #qr-box { 
            background: #ffffff; 
            padding: 6px; 
            width: 110px; 
            height: 110px; 
            border-radius: 8px; 
            flex-shrink: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 2px solid #ffffff;
        }
        #qr-box img, #qr-box canvas { 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: contain; 
        }

        .instrucoes { font-size: 0.78rem; color: #cbd5e1; line-height: 1.4; }
        .pix-code { background: #020617; padding: 10px; border: 1px solid #1e293b; font-size: 0.65rem; color: #64748b; word-break: break-all; margin: 10px 0; border-radius: 5px; max-height: 65px; overflow-y: auto; }
        .timer { color: var(--accent); font-size: 0.85rem; text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍔 DONY BURGUER'S</h1>
    <div class="sub">Terminal de Pagamento Instantâneo Nubank</div>

    <input type="text" id="valorManual" class="valor-input" placeholder="R$ 0,00" readonly>

    <div id="pagamento-area">
        <h3 style="text-align: center; color: var(--gold); margin-top: 0; font-size: 0.95rem; text-transform: uppercase;">Aguardando Transferência Pix...</h3>
        
        <div class="pix-flex">
            <div id="qr-box"></div>
            <div class="instrucoes">
                <strong>Destinatário:</strong> Nubank<br>
                <strong>Favorecido:</strong> JOSE LAPA<br>
                <strong>Chave:</strong> pradolindalva4@gmail.com<br><br>
                ⚡ O sistema confirma e imprime a comanda na cozinha em tempo real!
            </div>
        </div>
        
        <div id="pix-texto" class="pix-code"></div>
        <button id="btnCopiar" class="btn-principal" onclick="copiarPix()" style="margin-bottom: 10px;">📋 COPIAR CÓDIGO PIX</button>
        <div class="timer" id="timer">Tempo restante: 05:00</div>
    </div>
</div>

<script>
    // =========================================================================
    // CONFIGURAÇÃO INDUSTRIAL NATIVA (SEM BIBLIOTECAS EXTERNAS DO GOOGLE)
    // =========================================================================
    const CHAVE = "pradolindalva4@gmail.com";
    const NOME = "JOSE LAPA";
    const CIDADE = "MANAUS";

    // Detecta se a página está rodando no próprio celular ou em outro dispositivo
    const SERVIDOR_HOST = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") 
        ? "http://localhost:8080" 
        : `http://${window.location.hostname}:8080`;

    let valorCongelado = null;
    let pagamentoAprovado = false;

    function sanitizarValor(entrada) {
        if (typeof entrada === 'number') return isNaN(entrada) ? 0 : entrada;
        if (!entrada) return 0;
        let limpo = String(entrada).replace(/[^\d,\.]/g, '').replace(',', '.');
        let num = parseFloat(limpo);
        return isNaN(num) ? 0 : num;
    }

    function gerarPayload(valor, chavePixCustom) {
        const chaveUsada = chavePixCustom || CHAVE;
        const f = (id, v) => id + v.length.toString().padStart(2, '0') + v;
        const vStr = valor.toFixed(2);
        let p = "000201" + f("26", f("00", "br.gov.bcb.pix") + f("01", chaveUsada)) + "520400005303986" + f("54", vStr) + "5802BR" + f("59", NOME.substring(0,25)) + f("60", CIDADE.substring(0,15)) + "62070503***6304";
        let crc = 0xFFFF;
        for (let i = 0; i < p.length; i++) {
            crc ^= (p.charCodeAt(i) << 8);
            for (let j = 0; j < 8; j++) crc = (crc & 0x8000) ? (crc << 1) ^ 0x1021 : (crc << 1);
        }
        return p + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }

    function iniciarTimer(duracaoEmSegundos) {
        let timer = duracaoEmSegundos;
        const display = document.getElementById('timer');
        if(window.timerInterval) clearInterval(window.timerInterval);
        window.timerInterval = setInterval(() => {
            let minutos = parseInt(timer / 60, 10);
            let segundos = parseInt(timer % 60, 10);
            display.innerText = "Tempo restante: " + (minutos < 10 ? "0" + minutos : minutos) + ":" + (segundos < 10 ? "0" + segundos : segundos);
            if (--timer < 0) {
                clearInterval(window.timerInterval);
                display.innerText = "Código expirado!";
            }
        }, 1000);
    }

    function processarPix(valor, chavePersonalizada) {
        if (!valor || valor <= 0) return;
        const pix = gerarPayload(valor, chavePersonalizada);
        document.getElementById('pagamento-area').style.display = 'block';
        document.getElementById('qr-box').innerHTML = "";
        
        new QRCode(document.getElementById('qr-box'), { 
            text: pix, 
            width: 98, 
            height: 98,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });

        document.getElementById('pix-texto').innerText = pix;
        iniciarTimer(300);
    }

    // =========================================================================
    // COMUNICAÇÃO EM TEMPO REAL COM O MOTOR JAVA NATIVO (JDP REALTIME)
    // =========================================================================
    function conectarMotorNativo() {
        if (typeof EventSource !== "undefined") {
            try {
                const sse = new EventSource(`${SERVIDOR_HOST}/stream`);
                
                sse.onmessage = (event) => {
                    try {
                        const dados = JSON.parse(event.data);
                        tratarMudancaStatus(dados);
                    } catch (e) {}
                };

                sse.onerror = () => {
                    // Se falhar o SSE contínuo, ativa checagem de contingência
                    iniciarPollingContingencia();
                };
            } catch (err) {
                iniciarPollingContingencia();
            }
        } else {
            iniciarPollingContingencia();
        }
    }

    function iniciarPollingContingencia() {
        if (window.pollingAtivo) return;
        window.pollingAtivo = true;

        setInterval(() => {
            if (pagamentoAprovado) return;
            fetch(`${SERVIDOR_HOST}/caixa`)
                .then(res => res.json())
                .then(dados => tratarMudancaStatus(dados))
                .catch(() => {});
        }, 1500);
    }

    function tratarMudancaStatus(dados) {
        if (!dados || pagamentoAprovado) return;
        
        // Se o VigiaService deu baixa ou o status foi liberado na RAM
        if (dados.status === "PAGO" || (dados.status === "STANDBY" && valorCongelado !== null)) {
            mostrarPagamentoAprovado();
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const valUrl = sanitizarValor(urlParams.get('valor') || urlParams.get('total'));

        if (valUrl > 0) {
            valorCongelado = valUrl;
            document.getElementById('valorManual').value = "R$ " + valorCongelado.toFixed(2).replace('.', ',');
            processarPix(valorCongelado, CHAVE);
        }

        // Inicia a escuta direta no APK Java
        conectarMotorNativo();
    });

    function mostrarPagamentoAprovado() {
        pagamentoAprovado = true;
        if(window.timerInterval) clearInterval(window.timerInterval);

        document.getElementById('pagamento-area').innerHTML = `
            <div style="background: #10b981; color: #020617; padding: 20px; border-radius: 12px; text-align: center; font-weight: 900; box-shadow: 0 0 25px rgba(16,185,129,0.5);">
                <i class="fas fa-check-circle" style="font-size: 2.2rem; margin-bottom: 8px; display: block;"></i>
                PAGAMENTO APROVADO COM SUCESSO!<br>
                <span style="font-size: 13px; font-weight: normal; color: #020617;">Comanda impressa! Seu pedido já está sendo preparado.</span>
            </div>
        `;
    }

    function copiarPix() {
        const textoPix = document.getElementById('pix-texto').innerText;
        const tempInput = document.createElement('textarea');
        tempInput.value = textoPix;
        document.body.appendChild(tempInput);
        tempInput.select();
        tempInput.setSelectionRange(0, 99999);
        
        try {
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            const btn = document.getElementById('btnCopiar');
            btn.innerText = "✅ COPIADO COM SUCESSO!";
            btn.style.background = "#ffffff";
            btn.style.color = "#000";
            setTimeout(() => {
                btn.innerText = "📋 COPIAR CÓDIGO PIX";
                btn.style.background = "var(--accent)";
                btn.style.color = "#020617";
            }, 2500);
        } catch (err) {
            document.body.removeChild(tempInput);
            alert("Erro ao copiar. Selecione o código manualmente.");
        }
    }
</script>
</body>
</html>
