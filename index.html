    <script>
        let camadaAtiva = 1;
        let cereJson = {};
        
        // Carrega e descriptografa o banco embutido na RAM com proteção estrutural
        try {
            const rawBase64 = document.getElementById('cere-db').textContent.trim();
            if (rawBase64 !== "") {
                cereJson = JSON.parse(decodeURIComponent(escape(atob(rawBase64))));
            }
        } catch(e) {
            console.warn("Aguardando conexao externa do cere.json...");
        }
        
        window.history.replaceState({layer: 1}, "");

        // --- LÓGICA SOBERANO: LEITURA NO-CACHE COM ACELERADOR DE MICRO-TIMEOUT (EVITA TRAVAMENTO) ---
        async function carregarBancoCereExterno() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 400); // Micro-Timeout de 400ms para evitar UI Locks
            
            try {
                const response = await fetch('cere.json?_t=' + Date.now(), {
                    cache: 'no-store',
                    signal: controller.signal,
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                });
                clearTimeout(timeoutId);
                if (response.ok) {
                    const bancoExterno = await response.json();
                    if (bancoExterno) {
                        cereJson = bancoExterno;
                        console.log("CERE.JSON sincronizado via pasta local.");
                    }
                }
            } catch(err) {
                clearTimeout(timeoutId);
                console.log("Rodando via base de dados embutida (Offline/Bypass).");
            }
        }

        function irPara(id, pushToHistory = true) {
            id = parseInt(id);
            document.querySelectorAll('.layer').forEach(l => {
                l.classList.remove('active');
                l.style.display = 'none';
            });
            const proximaLayer = document.getElementById('layer-' + id);
            if(proximaLayer) {
                proximaLayer.classList.add('active');
                proximaLayer.style.display = 'block';
                camadaAtiva = id;
            }
            if (pushToHistory) {
                window.history.pushState({layer: id}, "");
            }
        }

        // EXECUÇÃO DO INDEX EM MEMÓRIA RAM - TOTALMENTE LIBERADO (CONECTADO AO BODY DIRETAMENTE)
        function abrirTelaCereDinamica(htmlConteudo) {
            let layerDinamica = document.getElementById('layer-dinamica-runtime');
            if (!layerDinamica) {
                layerDinamica = document.createElement('div');
                layerDinamica.id = 'layer-dinamica-runtime';
                layerDinamica.className = 'layer-dinamica';
                document.body.appendChild(layerDinamica); // TOTALMENTE LIBERADO E ANEXADO AO BODY
            }
            
            layerDinamica.innerHTML = `
                <div style="position: absolute; top: 15px; right: 15px; z-index: 10000000;">
                    <button onclick="fecharTelaCereDinamica()" style="background: rgba(0,0,0,0.85); color: #06b6d4; border: 2px solid #06b6d4; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(6,182,212,0.5); font-family: monospace; font-size: 13px; letter-spacing: 1px;">✕ VOLTAR</button>
                </div>
            `;
            
            const iframe = document.createElement('iframe');
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';
            iframe.style.background = '#000';
            iframe.style.transform = 'none'; // Lock de orientação
            layerDinamica.appendChild(iframe);
            
            // Injeção ativa de documento com reset absoluto de orientação
            setTimeout(() => {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                doc.open();
                doc.write('<style>html, body { margin:0; padding:0; width:100%; height:100%; overflow:auto; background:#000; color:#fff; transform:none !important; writing-mode:horizontal-tb !important; direction:ltr !important; }</style>' + htmlConteudo);
                doc.close();
            }, 50);
        }

        function fecharTelaCereDinamica() {
            const layerDinamica = document.getElementById('layer-dinamica-runtime');
            if(layerDinamica) {
                layerDinamica.remove(); // Desaloca completamente do DOM para liberar RAM
            }
            irPara(camadaAtiva, false);
        }

        // MAPEADOR DE CLIQUES ATIVOS
        document.querySelectorAll('.hotspot').forEach(h => {
            h.onclick = async function(e) {
                e.stopPropagation();
                if(this.dataset.target) {
                    irPara(this.dataset.target);
                } else if(this.dataset.link) {
                    window.open(this.dataset.link, '_blank');
                } else if(this.dataset.cereSerial) {
                    const serial = this.dataset.cereSerial;
                    
                    // Sincronização rápida sem travar a interface
                    try {
                        await carregarBancoCereExterno();
                    } catch(err) {}
                    
                    const htmlParaCarregar = cereJson[serial];
                    if (htmlParaCarregar) {
                        abrirTelaCereDinamica(htmlParaCarregar);
                    } else {
                        alert("Erro: O arquivo correspondente ao serial " + serial + " nao foi localizado no cere.json.");
                    }
                }
            }
        });

        window.addEventListener('popstate', function(event) {
            fecharTelaCereDinamica();
            if (event.state && event.state.layer) {
                irPara(event.state.layer, false);
            } else {
                irPara(1, false);
            }
        });

        // Inicialização rápida
        carregarBancoCereExterno().then(() => {
            irPara(1, false);
        });

        // REGISTRO DO SERVICE WORKER COM PROTEÇÃO DE PROTOCOLO SEGURO (EVITA TRAVAMENTO LOCAL)
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SISTEMA JDP: MOTOR PWA ATIVO'))
                    .catch(err => console.warn('SISTEMA JDP: ERRO SW', err));
            });
        }
    </script>
</body>
</html>
